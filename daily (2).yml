name: Daily LMM refresh
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: lmm, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Pull and normalise
        run: python lmm_pipeline.py
        continue-on-error: true
      - name: Commit history
        run: |
          git config user.name "lmm-bot"; git config user.email "lmm-bot@users.noreply.github.com"
          git add data/ && (git diff --cached --quiet || git commit -m "LMM snapshot $(date -u +%F)") && git push
      - name: Build site
        run: mkdir -p site/data && cp dashboard/index.html site/ && cp data/lmm_latest.json site/data/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
