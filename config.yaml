sources:
  cboe:
    label: Cboe BZX
    mode: url
    url: "https://www.cboe.com/us/equities/listings/trade_on_cboe/lmm/securities/csv/"
    format: csv
    columns: { symbol: symbol, fund_name: security_name, lmm: lmm, source_class: asset_class }
    role_label: Lead Market Maker
    class_map:
      - { match: "^(US|International) Equity", to: Equity }
      - { match: "^Fixed Income",              to: Fixed Income }
      - { match: "^Outcome",                   to: Outcome-Based }

  nasdaq:
    label: Nasdaq
    mode: url
    url: "https://www.nasdaqtrader.com/trader.aspx?id=etf_definitions"
    format: html_table
    columns:
      symbol: Symbol
      fund_name: Fund
      lmm: "DLP Firm"
      role: "DLP Type"
      source_class: "Bucket Label"
      type: Type
    include_roles: ["Designated Liquidity Provider"]
    class_map:
      - { match: "^Equity",            to: Equity }
      - { match: "^Fixed Income",      to: Fixed Income }
      - { match: "^Currency - Crypto", to: Digital Assets }
      - { match: "^Currency",          to: Currency }
      - { match: "^Commodit",          to: Commodity }
      - { match: "^Real Estate",       to: Real Estate }
      - { match: "^Multi Asset",       to: Multi-Asset }
    type_map:
      - { match: "Single Stock", to: Equity }

  # NYSE Arca is switched off until we have a data source for it.
  # nyse_arca:
  #   label: NYSE Arca
  #   mode: inbox
  #   format: xlsx
  #   columns: { symbol: Symbol, fund_name: Name, lmm: "Lead Market Maker" }

http:
  user_agent: "Mozilla/5.0 (compatible; lmm-tracker/1.0; +you@example.com)"
  timeout_seconds: 60
